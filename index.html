<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Nursery Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- 使用 ExcelJS 來支援從網頁匯出帶有實體圖片的 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .flip-card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .is-flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { backface-visibility: hidden; position: absolute; top:0; left:0; width:100%; height:100%; }
        .flip-card-back { transform: rotateY(180deg); }
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center py-6">
    <div x-data="flashcardApp()" class="w-full max-w-2xl px-4 flex flex-col items-center">
        
        <div x-show="currentMode === 'normal'" class="w-full flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-3">
                <h1 class="text-2xl font-bold text-indigo-900">學習閃卡系統</h1>
                <div class="flex gap-2">
                    <button @click="openAddModal()" class="bg-indigo-600 text-white px-3 py-2 rounded shadow hover:bg-indigo-700 font-bold text-sm">➕ 新增</button>
                    <!-- 網頁端匯出實體圖片 Excel 的按鈕 -->
                    <button @click="exportExcelWithImages()" class="bg-blue-600 text-white px-3 py-2 rounded shadow hover:bg-blue-700 font-bold text-sm flex items-center gap-1">
                        📤 下載 Excel (含照片)
                    </button>
                </div>
            </div>
            
            <div class="w-full overflow-x-auto whitespace-nowrap mb-3 pb-2 border-b-2 border-gray-200">
                <template x-for="deck in deckNames" :key="deck">
                    <button @click="setDeck(deck)" 
                            :class="currentDeckName === deck ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-indigo-600 border border-indigo-300'"
                            class="px-4 py-2 mr-2 rounded-lg font-bold transition-colors inline-block text-sm">
                        <span x-text="deck"></span>
                    </button>
                </template>
            </div>

            <div class="flex justify-between items-center w-full mb-4 gap-2">
                <div class="flex gap-1 bg-white p-1 rounded-lg border border-gray-200 shadow-sm flex-1">
                    <button @click="filterMode = 'review'" :class="filterMode === 'review' ? 'bg-red-500 text-white' : 'text-gray-600'" class="flex-1 py-1 px-2 rounded font-bold text-xs transition">🔄 需複習</button>
                    <button @click="filterMode = 'all'" :class="filterMode === 'all' ? 'bg-indigo-500 text-white' : 'text-gray-600'" class="flex-1 py-1 px-2 rounded font-bold text-xs transition">📚 全部</button>
                </div>
                <button @click="startStudyMode()" class="px-3 py-2 bg-blue-600 text-white font-bold rounded-lg shadow text-sm">🎯 純淨學習</button>
                <button @click="startGridMode()" class="px-3 py-2 bg-purple-600 text-white font-bold rounded-lg shadow text-sm">🔠 9宮格</button>
            </div>

            <div class="flex justify-between w-full mb-2 text-sm font-bold bg-white p-3 rounded-lg shadow-sm">
                <span class="text-green-600">✅ 已記住: <span x-text="knownCount"></span></span>
                <span class="text-red-500">🔄 需複習: <span x-text="reviewCount"></span></span>
                <span class="text-indigo-800">進度: <span x-text="activeList.length > 0 ? currentIndex + 1 : 0"></span> / <span x-text="activeList.length"></span></span>
            </div>

            <template x-if="activeList.length > 0">
                <div class="w-full h-80 perspective-1000 relative cursor-pointer select-none mb-4" 
                     :class="showDetails ? 'is-flipped' : ''" 
                     @click="showDetails = !showDetails">
                    <div class="flip-card-inner w-full h-full relative shadow-xl rounded-2xl">
                        <div class="flip-card-front bg-white rounded-2xl flex items-center justify-center border-t-8" 
                             :class="currentObj.status === '已記住' ? 'border-green-500' : 'border-indigo-500'">
                            <div class="absolute top-4 right-4 flex gap-2">
                                <button @click.stop="openDrawModal()" class="text-gray-400 hover:text-purple-600 p-1 font-bold text-sm bg-purple-50 px-2 rounded border border-purple-100" title="拍照/圖片塗鴉">📷 照片/塗鴉</button>
                                <button @click.stop="openEditModal()" class="text-gray-400 hover:text-indigo-600 p-1 font-bold text-sm bg-indigo-50 px-2 rounded border border-indigo-100" title="編輯單詞">✏️</button>
                                <div @click.stop="speakWord(currentObj.word)" title="播放發音">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400 hover:text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l4.707 4.707A1 1 0 0016 19.318V4.682a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" />
                                    </svg>
                                </div>
                            </div>
                            <span class="text-[5rem] md:text-[6rem] font-bold text-slate-800 text-center px-4" x-text="currentObj.word"></span>
                        </div>
                        <div class="flip-card-back bg-slate-50 rounded-2xl border-4 border-indigo-200 flex flex-col items-center justify-center p-6 text-center overflow-hidden">
                            <template x-if="currentObj.image">
                                <img :src="currentObj.image" class="h-40 object-contain mb-3 rounded border border-gray-300 bg-white shadow-sm" alt="illustration">
                            </template>
                            <template x-if="!currentObj.image"><div class="h-6 text-gray-400 text-sm italic">(點擊右上角「📷」拍攝實物)</div></template>
                            <div class="text-2xl font-bold text-indigo-900 mb-2" x-text="currentObj.word"></div>
                            <template x-if="currentObj.example">
                                <div class="text-lg text-slate-700 bg-white p-3 rounded-lg shadow-sm w-full" x-text="currentObj.example"></div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <div class="flex justify-between w-full mb-4 gap-4" x-show="activeList.length > 0">
                <button @click="prevCard()" class="flex-1 py-2 bg-gray-200 rounded-xl font-bold text-gray-700">⬅️ 上一個</button>
                <button @click="nextCard()" class="flex-1 py-2 bg-indigo-100 rounded-xl font-bold text-indigo-700">下一個 ➡️</button>
            </div>
            <div class="flex justify-between w-full gap-4" x-show="activeList.length > 0">
                <button @click="markStatus('已記住')" class="flex-1 py-3 border-2 border-green-500 rounded-xl font-bold" :class="currentObj.status === '已記住' ? 'bg-green-500 text-white' : 'bg-white text-green-600'">✅ 已記住</button>
                <button @click="markStatus('需複習')" class="flex-1 py-3 border-2 border-red-500 rounded-xl font-bold" :class="currentObj.status === '需複習' ? 'bg-red-500 text-white' : 'bg-white text-red-600'">🔄 需複習</button>
            </div>
        </div>

        <div x-show="currentMode === 'study'" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center select-none" style="display: none;">
            <button @click="currentMode = 'normal'" class="absolute top-6 right-6 p-4 text-gray-300 hover:text-red-500 text-xl font-bold z-50">✖ 離開</button>
            <div @click="nextCard()" class="w-full h-full flex items-center justify-center cursor-pointer">
                <span class="text-[18vw] md:text-[15vw] font-black text-slate-800" x-text="currentObj.word"></span>
            </div>
        </div>

        <div x-show="currentMode === 'grid'" class="w-full flex flex-col items-center" style="display: none;">
            <div class="w-full flex justify-between items-center mb-6">
                <button @click="currentMode = 'normal'" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-lg">⬅️ 返回</button>
                <h2 class="text-xl font-bold text-purple-700 flex-1 text-center" x-text="currentDeckName + ' 記憶檢測'"></h2>
            </div>
            <div class="flex gap-2 w-full mb-6">
                <select x-model="gridDisplayType" class="flex-1 border-2 border-purple-300 rounded-lg p-2 font-bold text-purple-800 outline-none">
                    <option value="word">顯示詞彙</option>
                    <option value="example">顯示例句</option>
                    <option value="image">顯示圖片</option>
                </select>
                <button @click="initGrid()" class="bg-purple-500 text-white font-bold px-6 py-2 rounded-lg shadow hover:bg-purple-600">🔄 洗牌換批</button>
            </div>
            <div class="grid grid-cols-3 gap-3 w-full">
                <template x-for="item in gridItems" :key="Math.random()">
                    <div class="bg-white border-2 border-indigo-100 shadow-sm rounded-xl aspect-square flex flex-col items-center justify-center p-2 cursor-pointer" @click="speakWord(item.word)">
                        <template x-if="gridDisplayType === 'word'"><span class="text-3xl md:text-5xl font-bold text-slate-800" x-text="item.word"></span></template>
                        <template x-if="gridDisplayType === 'example'"><span class="text-sm font-bold text-slate-600 text-center line-clamp-4" x-text="item.example || '(無例句)'"></span></template>
                        <template x-if="gridDisplayType === 'image'">
                            <div class="w-full h-full flex items-center justify-center">
                                <template x-if="item.image"><img :src="item.image" class="max-h-full max-w-full object-contain rounded"></template>
                                <template x-if="!item.image"><span class="text-gray-400 font-bold text-sm">(無圖)</span></template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- 拍攝與畫板 Modal -->
        <div x-show="showDrawModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4" style="display: none;">
            <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl flex flex-col items-center">
                <h3 class="text-lg font-bold text-purple-800 mb-2">📷 拍攝/塗鴉：<span x-text="currentObj.word"></span></h3>
                <div class="flex flex-wrap justify-center gap-2 mb-3 w-full">
                    <button @click="triggerUpload(true)" class="px-3 py-2 bg-blue-100 text-blue-800 rounded-lg font-bold text-sm flex-1">📷 拍照</button>
                    <button @click="triggerUpload(false)" class="px-3 py-2 bg-green-100 text-green-800 rounded-lg font-bold text-sm flex-1">📁 相簿/圖片</button>
                    <button @click="clearCanvas()" class="px-3 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold text-sm">🗑️ 清空</button>
                </div>
                <div class="border-4 border-gray-300 rounded-xl overflow-hidden bg-white shadow-inner relative">
                    <canvas id="drawCanvas" width="300" height="300" class="cursor-crosshair bg-slate-50"></canvas>
                </div>
                <div class="flex justify-end w-full mt-4 gap-2">
                    <button @click="showDrawModal = false" class="px-5 py-2 bg-gray-200 text-gray-700 rounded-xl font-bold">取消</button>
                    <button @click="saveDrawing()" class="px-5 py-2 bg-purple-600 text-white rounded-xl font-bold shadow-lg">💾 儲存並套用</button>
                </div>
            </div>
        </div>

        <!-- 編輯 Modal -->
        <div x-show="showModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" style="display: none;">
            <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <h3 class="text-xl font-bold text-indigo-900 mb-4" x-text="modalType === 'add' ? '➕ 新增單詞' : '✏️ 編輯單詞'"></h3>
                <div class="space-y-4">
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">卡組名稱</label><input type="text" x-model="modalData.deck" class="w-full border-2 border-gray-200 rounded-lg p-2 font-bold focus:border-indigo-500 outline-none" :disabled="modalType === 'edit'"></div>
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">詞彙</label><input type="text" x-model="modalData.word" class="w-full border-2 border-gray-200 rounded-lg p-2 font-bold focus:border-indigo-500 outline-none"></div>
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">圖片網址 (已有照片請留空)</label><input type="text" x-model="modalData.image" class="w-full border-2 border-gray-200 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none"></div>
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">例句</label><textarea x-model="modalData.example" class="w-full border-2 border-gray-200 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none" rows="2"></textarea></div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button @click="showModal = false" class="px-5 py-2 bg-gray-200 rounded-xl font-bold">取消</button>
                    <button @click="saveModalData()" class="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow-lg">儲存</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function flashcardApp() {
            return {
                decksData: {"中文認字卡 (示範)": [{"word": "爸爸", "image": "", "example": "", "status": "需複習"}, {"word": "手套", "image": "", "example": "", "status": "需複習"}, {"word": "媽媽", "image": "", "example": "", "status": "需複習"}, {"word": "月", "image": "", "example": "", "status": "需複習"}, {"word": "菜", "image": "", "example": "", "status": "需複習"}, {"word": "冬", "image": "", "example": "", "status": "需複習"}, {"word": "口", "image": "", "example": "", "status": "需複習"}, {"word": "人", "image": "", "example": "", "status": "需複習"}, {"word": "手", "image": "", "example": "", "status": "需複習"}, {"word": "女", "image": "", "example": "", "status": "需複習"}, {"word": "果", "image": "", "example": "", "status": "需複習"}, {"word": "魚", "image": "", "example": "", "status": "需複習"}, {"word": "眼", "image": "", "example": "", "status": "需複習"}, {"word": "耳", "image": "", "example": "", "status": "需複習"}, {"word": "門", "image": "", "example": "", "status": "需複習"}, {"word": "男", "image": "", "example": "", "status": "需複習"}], "英文詞彙 (示範)": [{"word": "apple", "image": "", "example": "", "status": "需複習"}, {"word": "ant", "image": "", "example": "", "status": "需複習"}, {"word": "ball", "image": "", "example": "", "status": "需複習"}, {"word": "bus", "image": "", "example": "", "status": "需複習"}, {"word": "cat", "image": "", "example": "", "status": "需複習"}, {"word": "cup", "image": "", "example": "", "status": "需複習"}, {"word": "dog", "image": "", "example": "", "status": "需複習"}, {"word": "door", "image": "", "example": "", "status": "需複習"}, {"word": "egg", "image": "", "example": "", "status": "需複習"}, {"word": "elephant", "image": "", "example": "", "status": "需複習"}, {"word": "fish", "image": "", "example": "", "status": "需複習"}, {"word": "fan", "image": "", "example": "", "status": "需複習"}, {"word": "girl", "image": "", "example": "", "status": "需複習"}, {"word": "grapes", "image": "", "example": "", "status": "需複習"}, {"word": "hat", "image": "", "example": "", "status": "需複習"}, {"word": "hand", "image": "", "example": "", "status": "需複習"}, {"word": "igloo", "image": "", "example": "", "status": "需複習"}, {"word": "ink", "image": "", "example": "", "status": "需複習"}, {"word": "jam", "image": "", "example": "", "status": "需複習"}, {"word": "juice", "image": "", "example": "", "status": "需複習"}, {"word": "kite", "image": "", "example": "", "status": "需複習"}, {"word": "king", "image": "", "example": "", "status": "需複習"}]},
                deckNames: [],
                currentDeckName: '',
                currentIndex: 0,
                showDetails: false,
                currentMode: 'normal',
                filterMode: 'review',
                
                showModal: false,
                showDrawModal: false,
                modalType: 'add',
                modalData: { deck: '', word: '', image: '', example: '', status: '需複習' },
                
                canvas: null, ctx: null, isDrawing: false,
                gridItems: [], gridDisplayType: 'word',
                
                init() {
                    this.deckNames = Object.keys(this.decksData);
                    if(this.deckNames.length > 0) this.currentDeckName = this.deckNames[0];
                    const saved = localStorage.getItem('flashcard_progress_v11');
                    if(saved) {
                        try {
                            const progress = JSON.parse(saved);
                            if(progress.decks) { this.decksData = progress.decks; this.deckNames = Object.keys(this.decksData); }
                        } catch(e) {}
                    }
                },
                
                saveProgress() { localStorage.setItem('flashcard_progress_v11', JSON.stringify({ decks: this.decksData })); },
                
                get activeList() {
                    const list = this.decksData[this.currentDeckName] || [];
                    if (this.filterMode === 'review') return list.filter(d => d.status !== '已記住');
                    return list;
                },
                get currentObj() {
                    if (this.activeList.length === 0) return {word: "無資料", image: "", example: "", status: "需複習"};
                    if (this.currentIndex >= this.activeList.length) this.currentIndex = 0;
                    return this.activeList[this.currentIndex];
                },
                get knownCount() { return (this.decksData[this.currentDeckName] || []).filter(d => d.status === '已記住').length; },
                get reviewCount() { return (this.decksData[this.currentDeckName] || []).filter(d => d.status !== '已記住').length; },
                
                setDeck(deck) { this.currentDeckName = deck; this.currentIndex = 0; this.showDetails = false; },
                nextCard() { if(this.activeList.length === 0) return; this.showDetails = false; this.currentIndex = (this.currentIndex + 1) % this.activeList.length; },
                prevCard() { if(this.activeList.length === 0) return; this.showDetails = false; this.currentIndex = (this.currentIndex - 1 + this.activeList.length) % this.activeList.length; },
                
                markStatus(status) {
                    if(this.activeList.length === 0) return;
                    this.activeList[this.currentIndex].status = status;
                    this.saveProgress();
                },
                
                openAddModal() { this.modalType = 'add'; this.modalData = { deck: this.currentDeckName, word: '', image: '', example: '', status: '需複習' }; this.showModal = true; },
                openEditModal() { this.modalType = 'edit'; const obj = this.currentObj; this.modalData = { deck: this.currentDeckName, word: obj.word, image: obj.image.startsWith('data:image') ? '' : obj.image, example: obj.example, status: obj.status }; this.showModal = true; },
                
                openDrawModal() { this.showDrawModal = true; setTimeout(() => { this.initCanvas(); }, 100); },
                
                initCanvas() {
                    this.canvas = document.getElementById('drawCanvas');
                    this.ctx = this.canvas.getContext('2d');
                    if (this.currentObj.image && this.currentObj.image.startsWith('data:image')) {
                        const img = new Image();
                        img.onload = () => {
                            this.ctx.fillStyle = "#ffffff"; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                            this.ctx.drawImage(img, 0, 0, this.canvas.width, this.canvas.height);
                            this.setupCanvasDrawing();
                        };
                        img.src = this.currentObj.image;
                    } else { this.clearCanvas(); this.setupCanvasDrawing(); }
                },
                
                setupCanvasDrawing() {
                    let getPos = (e) => {
                        let rect = this.canvas.getBoundingClientRect();
                        let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                        let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                        return { x: clientX - rect.left, y: clientY - rect.top };
                    };
                    this.canvas.onmousedown = (e) => { this.isDrawing = true; let pos = getPos(e); this.ctx.beginPath(); this.ctx.moveTo(pos.x, pos.y); };
                    this.canvas.onmousemove = (e) => { if(!this.isDrawing) return; let pos = getPos(e); this.ctx.lineTo(pos.x, pos.y); this.ctx.stroke(); };
                    this.canvas.onmouseup = () => { this.isDrawing = false; };
                    this.canvas.ontouchstart = (e) => { this.isDrawing = true; let pos = getPos(e); this.ctx.beginPath(); this.ctx.moveTo(pos.x, pos.y); e.preventDefault(); };
                    this.canvas.ontouchmove = (e) => { if(!this.isDrawing) return; let pos = getPos(e); this.ctx.lineTo(pos.x, pos.y); this.ctx.stroke(); e.preventDefault(); };
                    this.canvas.ontouchend = () => { this.isDrawing = false; };
                },
                
                triggerUpload(capture) {
                    const input = document.createElement('input');
                    input.type = 'file'; input.accept = 'image/*';
                    if (capture) input.capture = 'environment';
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = new Image();
                            img.onload = () => {
                                this.clearCanvas();
                                const scale = Math.min(this.canvas.width / img.width, this.canvas.height / img.height);
                                const w = img.width * scale, h = img.height * scale;
                                const x = (this.canvas.width - w) / 2, y = (this.canvas.height - h) / 2;
                                this.ctx.drawImage(img, x, y, w, h);
                                this.ctx.lineWidth = 4; this.ctx.lineCap = 'round'; this.ctx.strokeStyle = '#ef4444';
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    };
                    input.click();
                },
                
                clearCanvas() {
                    this.ctx.fillStyle = "#ffffff"; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.lineWidth = 5; this.ctx.lineCap = 'round'; this.ctx.strokeStyle = '#1e1b4b';
                },
                
                saveDrawing() {
                    const dataUrl = this.canvas.toDataURL("image/jpeg", 0.7);
                    this.currentObj.image = dataUrl;
                    this.saveProgress();
                    this.showDrawModal = false;
                },
                
                // === 使用 ExcelJS 產生內嵌實體圖片的 Excel ===
                async exportExcelWithImages() {
                    const workbook = new ExcelJS.Workbook();
                    const worksheet = workbook.addWorksheet('Flashcards');
                    worksheet.columns = [
                        { header: '卡組名稱', key: 'deck', width: 20 },
                        { header: '詞彙', key: 'word', width: 20 },
                        { header: '真實圖片', key: 'visual_img', width: 25 },
                        { header: '例句', key: 'example', width: 40 },
                        { header: '狀態', key: 'status', width: 15 }
                    ];
                    worksheet.getRow(1).eachCell(cell => { cell.font = { bold: true }; cell.alignment = { vertical: 'middle', horizontal: 'center' }; });

                    let rowIndex = 2;
                    for (let deck in this.decksData) {
                        for (let item of this.decksData[deck]) {
                            const row = worksheet.addRow({ deck: deck, word: item.word, example: item.example, status: item.status });
                            worksheet.getRow(rowIndex).height = 100;
                            row.eachCell(cell => { cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; });

                            if (item.image && item.image.startsWith('data:image')) {
                                try {
                                    const base64Data = item.image.split(',')[1];
                                    const ext = item.image.includes('png') ? 'png' : 'jpeg';
                                    const imageId = workbook.addImage({ base64: base64Data, extension: ext });
                                    // 插入到 C 欄 (col 2, 因 ExcelJS 是 0-based indexing for placement)
                                    worksheet.addImage(imageId, { tl: { col: 2, row: rowIndex - 1 }, ext: { width: 110, height: 110 }, editAs: 'oneCell' });
                                } catch(e) { console.error("圖片匯出失敗:", e); }
                            } else if (item.image) {
                                row.getCell('visual_img').value = item.image;
                            }
                            rowIndex++;
                        }
                    }
                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const dateStr = new Date().toISOString().slice(0,10);
                    saveAs(blob, `Flashcards_包含照片進度_${dateStr}.xlsx`);
                },
                
                saveModalData() {
                    const deck = this.modalData.deck.trim() || '未分類卡組';
                    const word = this.modalData.word.trim();
                    if(!word) return;
                    if(!this.decksData[deck]) { this.decksData[deck] = []; this.deckNames = Object.keys(this.decksData); }
                    if(this.modalType === 'add') {
                        this.decksData[deck].push({ word: word, image: this.modalData.image.trim(), example: this.modalData.example.trim(), status: '需複習' });
                    } else {
                        const obj = this.currentObj;
                        obj.word = word;
                        if (obj.image.startsWith('data:image') && this.modalData.image.trim() === '') { /* 保留原照片 */ } 
                        else { obj.image = this.modalData.image.trim(); }
                        obj.example = this.modalData.example.trim();
                    }
                    this.saveProgress(); this.showModal = false; this.currentDeckName = deck;
                },
                
                startStudyMode() { if(this.activeList.length === 0) return; this.currentMode = 'study'; },
                startGridMode() { if(this.activeList.length === 0) return; this.currentMode = 'grid'; this.initGrid(); },
                initGrid() {
                    let arr = [...this.activeList];
                    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
                    this.gridItems = arr.slice(0, 9);
                },
                speakWord(wordText) {
                    if (!wordText) return; const synth = window.speechSynthesis; synth.cancel();
                    const utterance = new SpeechSynthesisUtterance(wordText);
                    utterance.lang = this.currentDeckName.includes('英文') || /^[a-zA-Z\s]+$/.test(wordText) ? 'en-US' : 'zh-HK';
                    synth.speak(utterance);
                }
            }
        }
    </script>
</body>
</html>
