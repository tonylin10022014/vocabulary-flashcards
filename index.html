<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Nursery Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .flip-card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .is-flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { backface-visibility: hidden; position: absolute; top:0; left:0; width:100%; height:100%; }
        .flip-card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center py-6">
    <div x-data="flashcardApp()" class="w-full max-w-xl px-4 flex flex-col items-center">
        
        <div class="w-full flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-900">學前詞彙閃卡</h1>
            <button @click="downloadProgress()" class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">
                📥 下載進度
            </button>
        </div>
        
        <!-- Deck Selection -->
        <div class="flex space-x-2 mb-6 w-full">
            <button @click="setDeck('chinese')" 
                    :class="currentDeck === 'chinese' ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-600'"
                    class="flex-1 py-2 border border-indigo-600 rounded-lg font-semibold transition-colors">
                中文認字卡
            </button>
            <button @click="setDeck('english')" 
                    :class="currentDeck === 'english' ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-600'"
                    class="flex-1 py-2 border border-indigo-600 rounded-lg font-semibold transition-colors">
                English Cards
            </button>
        </div>

        <!-- Progress Stats -->
        <div class="flex justify-between w-full mb-2 text-sm font-bold">
            <span class="text-green-600">已記住: <span x-text="knownCount"></span></span>
            <span class="text-red-500">需複習: <span x-text="reviewCount"></span></span>
            <span class="text-indigo-800">卡片: <span x-text="currentIndex + 1"></span> / <span x-text="activeList.length"></span></span>
        </div>

        <!-- Flashcard Area -->
        <div class="w-full h-80 perspective-1000 relative cursor-pointer select-none mb-6" 
             :class="showDetails ? 'is-flipped' : ''" 
             @click="showDetails = !showDetails">
            
            <div class="flip-card-inner w-full h-full relative shadow-xl rounded-2xl">
                <!-- Front (Word) -->
                <div class="flip-card-front bg-white rounded-2xl flex items-center justify-center border-t-8" 
                     :class="currentObj.status === '已記住' ? 'border-green-500' : 'border-indigo-500'">
                    
                    <div class="absolute top-4 right-4" @click.stop="speakWord()" title="播放發音">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l4.707 4.707A1 1 0 0016 19.318V4.682a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" />
                        </svg>
                    </div>

                    <span class="text-6xl md:text-8xl font-bold text-slate-700 text-center px-4" x-text="currentObj.word"></span>
                </div>

                <!-- Back (Details) -->
                <div class="flip-card-back bg-slate-50 rounded-2xl border-4 border-indigo-200 flex flex-col items-center justify-center p-6 text-center">
                    <template x-if="currentObj.image">
                        <img :src="currentObj.image" class="h-32 object-contain mb-4 rounded" alt="illustration">
                    </template>
                    <template x-if="!currentObj.image">
                        <div class="h-32 flex items-center text-gray-400 italic mb-4">(無圖片)</div>
                    </template>
                    
                    <div class="text-xl font-bold text-indigo-900 mb-2" x-text="currentObj.word"></div>
                    
                    <template x-if="currentObj.example">
                        <div class="text-lg text-slate-700 bg-white p-3 rounded-lg shadow-sm w-full" x-text="currentObj.example"></div>
                    </template>
                    <template x-if="!currentObj.example">
                        <div class="text-sm text-gray-400 italic">無例句資料</div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Controls (Prev / Next) -->
        <div class="flex justify-between w-full mb-6 gap-4">
            <button @click="prevCard()" class="flex-1 py-3 bg-gray-200 hover:bg-gray-300 rounded-xl font-bold text-gray-700 text-lg transition">
                ⬅️ 上一個
            </button>
            <button @click="nextCard()" class="flex-1 py-3 bg-indigo-100 hover:bg-indigo-200 rounded-xl font-bold text-indigo-700 text-lg transition">
                下一個 ➡️
            </button>
        </div>

        <!-- Status Marking -->
        <div class="flex justify-between w-full gap-4">
            <button @click="markStatus('已記住')" class="flex-1 py-3 border-2 border-green-500 rounded-xl font-bold transition flex items-center justify-center gap-2"
                    :class="currentObj.status === '已記住' ? 'bg-green-500 text-white' : 'bg-white text-green-600'">
                ✅ 已記住 (No need)
            </button>
            <button @click="markStatus('需複習')" class="flex-1 py-3 border-2 border-red-500 rounded-xl font-bold transition flex items-center justify-center gap-2"
                    :class="currentObj.status === '需複習' ? 'bg-red-500 text-white' : 'bg-white text-red-600'">
                🔄 需複習 (To rmb)
            </button>
        </div>

    </div>

    <script>
        function flashcardApp() {
            return {
                chineseData: [{"word": "爸爸", "image": "", "example": "", "status": "需複習"}, {"word": "手套", "image": "", "example": "", "status": "需複習"}, {"word": "媽媽", "image": "", "example": "", "status": "需複習"}, {"word": "月", "image": "", "example": "", "status": "需複習"}, {"word": "菜", "image": "", "example": "", "status": "需複習"}, {"word": "冬", "image": "", "example": "", "status": "需複習"}, {"word": "口", "image": "", "example": "", "status": "需複習"}, {"word": "人", "image": "", "example": "", "status": "需複習"}, {"word": "手", "image": "", "example": "", "status": "需複習"}, {"word": "女", "image": "", "example": "", "status": "需複習"}, {"word": "果", "image": "", "example": "", "status": "需複習"}, {"word": "魚", "image": "", "example": "", "status": "需複習"}, {"word": "眼", "image": "", "example": "", "status": "需複習"}, {"word": "耳", "image": "", "example": "", "status": "需複習"}, {"word": "門", "image": "", "example": "", "status": "需複習"}, {"word": "男", "image": "", "example": "", "status": "需複習"}],
                englishData: [{"word": "apple", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "ant", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "ball", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "bus", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "cat", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "cup", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "dog", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "door", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "egg", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "elephant", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "fish", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "fan", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "girl", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "grapes", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "hat", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "hand", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "igloo", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "ink", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "jam", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "juice", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "kite", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}, {"word": "king", "image": "", "example": "", "status": "\u9700\u8907\u7fd2"}],
                currentDeck: 'chinese',
                currentIndex: 0,
                showDetails: false,
                
                init() {
                    // 從 localStorage 讀取之前的進度
                    const saved = localStorage.getItem('flashcard_progress');
                    if(saved) {
                        const progress = JSON.parse(saved);
                        this.mergeProgress(this.chineseData, progress.chinese || []);
                        this.mergeProgress(this.englishData, progress.english || []);
                    }
                },
                
                mergeProgress(localList, savedList) {
                    const statusMap = {};
                    savedList.forEach(item => statusMap[item.word] = item.status);
                    localList.forEach(item => {
                        if (statusMap[item.word]) item.status = statusMap[item.word];
                    });
                },
                
                saveProgress() {
                    const progress = {
                        chinese: this.chineseData.map(d => ({word: d.word, status: d.status})),
                        english: this.englishData.map(d => ({word: d.word, status: d.status}))
                    };
                    localStorage.setItem('flashcard_progress', JSON.stringify(progress));
                },
                
                get activeList() {
                    return this.currentDeck === 'chinese' ? this.chineseData : this.englishData;
                },
                
                get currentObj() {
                    if (this.activeList.length === 0) return {word: "無資料", image: "", example: "", status: "需複習"};
                    return this.activeList[this.currentIndex];
                },
                
                get knownCount() { return this.activeList.filter(d => d.status === '已記住').length; },
                get reviewCount() { return this.activeList.filter(d => d.status === '需複習').length; },
                
                setDeck(deck) {
                    this.currentDeck = deck;
                    this.currentIndex = 0;
                    this.showDetails = false;
                },
                
                nextCard() {
                    if (this.activeList.length === 0) return;
                    this.showDetails = false;
                    setTimeout(() => {
                        this.currentIndex = (this.currentIndex + 1) % this.activeList.length;
                    }, 150);
                },
                
                prevCard() {
                    if (this.activeList.length === 0) return;
                    this.showDetails = false;
                    setTimeout(() => {
                        this.currentIndex = (this.currentIndex - 1 + this.activeList.length) % this.activeList.length;
                    }, 150);
                },
                
                markStatus(status) {
                    this.activeList[this.currentIndex].status = status;
                    this.saveProgress();
                    // 如果標記為已記住，自動跳下一張
                    if(status === '已記住') setTimeout(() => this.nextCard(), 300);
                },
                
                downloadProgress() {
                    this.saveProgress();
                    const dataStr = localStorage.getItem('flashcard_progress');
                    const blob = new Blob([dataStr], {type: "application/json"});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'progress.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                },
                
                speakWord() {
                    if (!this.currentObj.word || this.currentObj.word === "無資料") return;
                    const synth = window.speechSynthesis;
                    const utterance = new SpeechSynthesisUtterance(this.currentObj.word);
                    utterance.lang = this.currentDeck === 'chinese' ? 'zh-HK' : 'en-US';
                    synth.speak(utterance);
                }
            }
        }
    </script>
</body>
</html>
