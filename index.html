<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Nursery Vocabulary Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center py-10">
    <div x-data="flashcardApp()" class="w-full max-w-2xl px-4 flex flex-col items-center">
        
        <h1 class="text-3xl font-bold mb-8 text-indigo-900">學前詞彙閃卡</h1>
        
        <div class="flex space-x-4 mb-8">
            <button @click="setDeck('chinese')" 
                    :class="currentDeck === 'chinese' ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-600 border border-indigo-600'"
                    class="px-6 py-2 rounded-lg font-semibold transition-colors duration-200 shadow-sm">
                中文認字卡
            </button>
            <button @click="setDeck('english')" 
                    :class="currentDeck === 'english' ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-600 border border-indigo-600'"
                    class="px-6 py-2 rounded-lg font-semibold transition-colors duration-200 shadow-sm">
                English Word Cards
            </button>
        </div>

        <div @click="nextCard()" 
             class="w-full h-80 bg-white rounded-2xl shadow-xl flex items-center justify-center cursor-pointer hover:shadow-2xl transition-shadow duration-300 select-none border-t-8 border-indigo-500 relative">
            
            <div class="absolute top-4 right-4" @click.stop="speakWord()" title="播放發音" x-show="currentWord">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400 hover:text-indigo-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l4.707 4.707A1 1 0 0016 19.318V4.682a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" />
                </svg>
            </div>

            <span class="text-6xl md:text-8xl font-bold text-slate-700 text-center px-4" 
                  x-text="currentWord"
                  x-transition:enter="transition ease-out duration-300"
                  x-transition:enter-start="opacity-0 transform scale-90"
                  x-transition:enter-end="opacity-100 transform scale-100">
            </span>
        </div>
        
        <p class="mt-6 text-slate-500 font-medium">點擊卡片切換下一個詞彙</p>
        
        <div class="mt-8 text-lg font-semibold text-indigo-800 bg-indigo-100 px-4 py-2 rounded-full" x-show="activeList.length > 0">
            <span x-text="currentIndex + 1"></span> / <span x-text="activeList.length"></span>
        </div>
    </div>

    <script>
        function flashcardApp() {
            return {
                chineseWords: ["爸爸", "手套", "媽媽", "月", "菜", "冬", "口", "人", "手", "女", "果", "魚", "眼", "耳", "門", "男"],
                englishWords: ["apple", "ant", "ball", "bus", "cat", "cup", "dog", "door", "egg", "elephant", "fish", "fan", "girl", "grapes", "hat", "hand", "igloo", "ink", "jam", "juice", "kite", "king"],
                currentDeck: 'chinese',
                currentIndex: 0,
                
                get activeList() {
                    return this.currentDeck === 'chinese' ? this.chineseWords : this.englishWords;
                },
                
                get currentWord() {
                    if (this.activeList.length === 0) return "無資料";
                    return this.activeList[this.currentIndex];
                },
                
                setDeck(deck) {
                    this.currentDeck = deck;
                    this.currentIndex = 0;
                },
                
                nextCard() {
                    if (this.activeList.length === 0) return;
                    if (this.currentIndex < this.activeList.length - 1) {
                        this.currentIndex++;
                    } else {
                        this.currentIndex = 0;
                    }
                },
                
                speakWord() {
                    if (!this.currentWord || this.currentWord === "無資料") return;
                    const synth = window.speechSynthesis;
                    const utterance = new SpeechSynthesisUtterance(this.currentWord);
                    utterance.lang = this.currentDeck === 'chinese' ? 'zh-HK' : 'en-US';
                    synth.speak(utterance);
                }
            }
        }
    </script>
</body>
</html>
