<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Nursery Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .flip-card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .is-flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { backface-visibility: hidden; position: absolute; top:0; left:0; width:100%; height:100%; }
        .flip-card-back { transform: rotateY(180deg); }
        ::-webkit-scrollbar { height: 8px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center py-6">
    <div x-data="flashcardApp()" class="w-full max-w-2xl px-4 flex flex-col items-center">
        
        <!-- ================= 正常模式 UI ================= -->
        <div x-show="currentMode === 'normal'" class="w-full flex flex-col items-center">
            
            <div class="w-full flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold text-indigo-900">學習閃卡系統</h1>
                <button @click="downloadProgress()" class="bg-green-600 text-white px-3 py-1 rounded shadow hover:bg-green-700">
                    📥 下載進度
                </button>
            </div>
            
            <!-- 動態生成的卡組按鈕 (支援無限擴充) -->
            <div class="w-full overflow-x-auto whitespace-nowrap mb-4 pb-2">
                <template x-for="deck in deckNames" :key="deck">
                    <button @click="setDeck(deck)" 
                            :class="currentDeckName === deck ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-indigo-600 border border-indigo-300'"
                            class="px-4 py-2 mr-2 rounded-lg font-bold transition-colors inline-block">
                        <span x-text="deck"></span>
                    </button>
                </template>
            </div>

            <!-- 模式切換按鈕 -->
            <div class="flex gap-2 w-full mb-6">
                <button @click="startStudyMode()" class="flex-1 py-3 bg-blue-500 text-white font-bold rounded-xl shadow-lg hover:bg-blue-600 text-lg">
                    🎯 進入學習模式
                </button>
                <button @click="startGridMode()" class="flex-1 py-3 bg-purple-500 text-white font-bold rounded-xl shadow-lg hover:bg-purple-600 text-lg">
                    🔠 進入9宮格記憶
                </button>
            </div>

            <!-- 進度統計 -->
            <div class="flex justify-between w-full mb-2 text-sm font-bold bg-white p-3 rounded-lg shadow-sm">
                <span class="text-green-600">✅ 已記住: <span x-text="knownCount"></span></span>
                <span class="text-red-500">🔄 需複習: <span x-text="reviewCount"></span></span>
                <span class="text-indigo-800">進度: <span x-text="currentIndex + 1"></span> / <span x-text="activeList.length"></span></span>
            </div>

            <!-- 閃卡主體 -->
            <div class="w-full h-80 perspective-1000 relative cursor-pointer select-none mb-6" 
                 :class="showDetails ? 'is-flipped' : ''" 
                 @click="showDetails = !showDetails">
                
                <div class="flip-card-inner w-full h-full relative shadow-xl rounded-2xl">
                    <!-- 正面 -->
                    <div class="flip-card-front bg-white rounded-2xl flex items-center justify-center border-t-8" 
                         :class="currentObj.status === '已記住' ? 'border-green-500' : 'border-indigo-500'">
                        <div class="absolute top-4 right-4" @click.stop="speakWord(currentObj.word)" title="播放發音">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400 hover:text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l4.707 4.707A1 1 0 0016 19.318V4.682a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" />
                            </svg>
                        </div>
                        <span class="text-[5rem] md:text-[6rem] font-bold text-slate-800 text-center px-4" x-text="currentObj.word"></span>
                    </div>

                    <!-- 背面 -->
                    <div class="flip-card-back bg-slate-50 rounded-2xl border-4 border-indigo-200 flex flex-col items-center justify-center p-6 text-center">
                        <template x-if="currentObj.image">
                            <img :src="currentObj.image" class="h-32 object-contain mb-4 rounded" alt="illustration">
                        </template>
                        <template x-if="!currentObj.image"><div class="h-10"></div></template>
                        
                        <div class="text-3xl font-bold text-indigo-900 mb-4" x-text="currentObj.word"></div>
                        
                        <template x-if="currentObj.example">
                            <div class="text-xl text-slate-700 bg-white p-4 rounded-lg shadow-sm w-full" x-text="currentObj.example"></div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 控制列 (上一張/下一張) -->
            <div class="flex justify-between w-full mb-6 gap-4">
                <button @click="prevCard()" class="flex-1 py-3 bg-gray-200 rounded-xl font-bold text-gray-700 text-lg hover:bg-gray-300">⬅️ 上一個</button>
                <button @click="nextCard()" class="flex-1 py-3 bg-indigo-100 rounded-xl font-bold text-indigo-700 text-lg hover:bg-indigo-200">下一個 ➡️</button>
            </div>

            <!-- 狀態標記 -->
            <div class="flex justify-between w-full gap-4">
                <button @click="markStatus('已記住')" class="flex-1 py-3 border-2 border-green-500 rounded-xl font-bold transition"
                        :class="currentObj.status === '已記住' ? 'bg-green-500 text-white' : 'bg-white text-green-600'">
                    ✅ 已記住
                </button>
                <button @click="markStatus('需複習')" class="flex-1 py-3 border-2 border-red-500 rounded-xl font-bold transition"
                        :class="currentObj.status === '需複習' ? 'bg-red-500 text-white' : 'bg-white text-red-600'">
                    🔄 需複習
                </button>
            </div>
        </div>

        <!-- ================= 純淨學習模式 ================= -->
        <div x-show="currentMode === 'study'" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center select-none" style="display: none;">
            
            <!-- 學習模式左上角：發音與語言設定 (半透明，移入顯示) -->
            <div class="absolute top-6 left-6 z-50 flex gap-3 opacity-20 hover:opacity-100 transition-opacity duration-300">
                <label class="flex items-center gap-2 bg-gray-100 px-3 py-2 rounded-lg text-gray-700 cursor-pointer shadow-sm font-bold border border-gray-300">
                    <input type="checkbox" x-model="autoPronounce" class="w-4 h-4 cursor-pointer"> 自動發音
                </label>
                <select x-model="pronounceLang" class="bg-gray-100 px-3 py-2 rounded-lg text-gray-700 font-bold outline-none shadow-sm cursor-pointer border border-gray-300">
                    <option value="auto">自動偵測語言</option>
                    <option value="zh-HK">粵語</option>
                    <option value="zh-CN">普通話</option>
                    <option value="en-US">English</option>
                </select>
            </div>

            <button @click="currentMode = 'normal'" class="absolute top-6 right-6 p-4 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-full transition duration-300 text-xl font-bold z-50">
                ✖ 離開
            </button>
            
            <div @click="nextCard()" class="w-full h-full flex items-center justify-center cursor-pointer">
                <span class="text-[18vw] md:text-[15vw] font-black text-slate-800" 
                      x-text="currentObj.word"
                      x-transition:enter="transition ease-out duration-200"
                      x-transition:enter-start="opacity-0 scale-90"
                      x-transition:enter-end="opacity-100 scale-100">
                </span>
            </div>
            <div class="absolute bottom-8 text-gray-300 font-bold tracking-widest pointer-events-none">點擊畫面切換下一個字</div>
        </div>

        <!-- ================= 9宮格記憶模式 ================= -->
        <div x-show="currentMode === 'grid'" class="w-full flex flex-col items-center" style="display: none;">
            
            <div class="w-full flex justify-between items-center mb-6">
                <button @click="currentMode = 'normal'" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-lg">⬅️ 返回</button>
                <h2 class="text-xl font-bold text-purple-700 flex-1 text-center" x-text="currentDeckName + ' 記憶檢測'"></h2>
            </div>
            
            <div class="flex gap-2 w-full mb-6">
                <select x-model="gridDisplayType" class="flex-1 border-2 border-purple-300 rounded-lg p-2 font-bold text-purple-800 outline-none">
                    <option value="word">顯示詞彙</option>
                    <option value="example">顯示例句</option>
                    <option value="image">顯示圖片</option>
                </select>
                <button @click="initGrid()" class="bg-purple-500 text-white font-bold px-6 py-2 rounded-lg shadow hover:bg-purple-600">
                    🔄 換一批 / 洗牌
                </button>
            </div>

            <!-- 3x3 網格 -->
            <div class="grid grid-cols-3 gap-3 w-full">
                <template x-for="item in gridItems" :key="Math.random()">
                    <div class="bg-white border-2 border-indigo-100 shadow-sm rounded-xl aspect-square flex flex-col items-center justify-center p-2 cursor-pointer hover:bg-indigo-50 hover:scale-105 transition"
                         @click="speakWord(item.word)">
                        
                        <template x-if="gridDisplayType === 'word'">
                            <span class="text-3xl md:text-5xl font-bold text-slate-800" x-text="item.word"></span>
                        </template>
                        
                        <template x-if="gridDisplayType === 'example'">
                            <span class="text-sm md:text-lg font-bold text-slate-600 text-center line-clamp-4" x-text="item.example || '(無例句)'"></span>
                        </template>
                        
                        <template x-if="gridDisplayType === 'image'">
                            <div class="w-full h-full flex items-center justify-center">
                                <template x-if="item.image">
                                    <img :src="item.image" class="max-h-full max-w-full object-contain rounded">
                                </template>
                                <template x-if="!item.image">
                                    <span class="text-gray-400 font-bold">(無圖)</span>
                                </template>
                            </div>
                        </template>
                        
                    </div>
                </template>
            </div>
            <div class="mt-6 text-gray-500 font-bold text-sm">點擊格子可以聆聽發音</div>
        </div>

    </div>

    <script>
        function flashcardApp() {
            return {
                decksData: {"中文認字卡 (示範)": [{"word": "爸爸", "image": "", "example": "", "status": "需複習"}, {"word": "手套", "image": "", "example": "", "status": "需複習"}, {"word": "媽媽", "image": "", "example": "", "status": "需複習"}, {"word": "月", "image": "", "example": "", "status": "需複習"}, {"word": "菜", "image": "", "example": "", "status": "需複習"}, {"word": "冬", "image": "", "example": "", "status": "需複習"}, {"word": "口", "image": "", "example": "", "status": "需複習"}, {"word": "人", "image": "", "example": "", "status": "需複習"}, {"word": "手", "image": "", "example": "", "status": "需複習"}, {"word": "女", "image": "", "example": "", "status": "需複習"}, {"word": "果", "image": "", "example": "", "status": "需複習"}, {"word": "魚", "image": "", "example": "", "status": "需複習"}, {"word": "眼", "image": "", "example": "", "status": "需複習"}, {"word": "耳", "image": "", "example": "", "status": "需複習"}, {"word": "門", "image": "", "example": "", "status": "需複習"}, {"word": "男", "image": "", "example": "", "status": "需複習"}], "英文詞彙 (示範)": [{"word": "apple", "image": "", "example": "", "status": "需複習"}, {"word": "ant", "image": "", "example": "", "status": "需複習"}, {"word": "ball", "image": "", "example": "", "status": "需複習"}, {"word": "bus", "image": "", "example": "", "status": "需複習"}, {"word": "cat", "image": "", "example": "", "status": "需複習"}, {"word": "cup", "image": "", "example": "", "status": "需複習"}, {"word": "dog", "image": "", "example": "", "status": "需複習"}, {"word": "door", "image": "", "example": "", "status": "需複習"}, {"word": "egg", "image": "", "example": "", "status": "需複習"}, {"word": "elephant", "image": "", "example": "", "status": "需複習"}, {"word": "fish", "image": "", "example": "", "status": "需複習"}, {"word": "fan", "image": "", "example": "", "status": "需複習"}, {"word": "girl", "image": "", "example": "", "status": "需複習"}, {"word": "grapes", "image": "", "example": "", "status": "需複習"}, {"word": "hat", "image": "", "example": "", "status": "需複習"}, {"word": "hand", "image": "", "example": "", "status": "需複習"}, {"word": "igloo", "image": "", "example": "", "status": "需複習"}, {"word": "ink", "image": "", "example": "", "status": "需複習"}, {"word": "jam", "image": "", "example": "", "status": "需複習"}, {"word": "juice", "image": "", "example": "", "status": "需複習"}, {"word": "kite", "image": "", "example": "", "status": "需複習"}, {"word": "king", "image": "", "example": "", "status": "需複習"}]},
                deckNames: [],
                currentDeckName: '',
                currentIndex: 0,
                showDetails: false,
                currentMode: 'normal',
                
                autoPronounce: true,
                pronounceLang: 'auto',
                
                gridItems: [],
                gridDisplayType: 'word',
                
                init() {
                    this.deckNames = Object.keys(this.decksData);
                    if(this.deckNames.length > 0) this.currentDeckName = this.deckNames[0];
                    
                    const saved = localStorage.getItem('flashcard_progress_v3');
                    if(saved) {
                        const progress = JSON.parse(saved);
                        for(let deck in progress) {
                            if(this.decksData[deck]) {
                                const statusMap = {};
                                progress[deck].forEach(item => statusMap[item.word] = item.status);
                                this.decksData[deck].forEach(item => {
                                    if(statusMap[item.word]) item.status = statusMap[item.word];
                                });
                            }
                        }
                    }
                },
                
                saveProgress() {
                    const progress = {};
                    for(let deck in this.decksData) {
                        progress[deck] = this.decksData[deck].map(d => ({word: d.word, status: d.status}));
                    }
                    localStorage.setItem('flashcard_progress_v3', JSON.stringify(progress));
                },
                
                get activeList() {
                    return this.decksData[this.currentDeckName] || [];
                },
                
                get currentObj() {
                    if (this.activeList.length === 0) return {word: "無資料", image: "", example: "", status: "需複習"};
                    return this.activeList[this.currentIndex];
                },
                
                get knownCount() { return this.activeList.filter(d => d.status === '已記住').length; },
                get reviewCount() { return this.activeList.filter(d => d.status === '需複習').length; },
                
                setDeck(deck) {
                    this.currentDeckName = deck;
                    this.currentIndex = 0;
                    this.showDetails = false;
                },
                
                nextCard() {
                    if (this.activeList.length === 0) return;
                    this.showDetails = false;
                    this.currentIndex = (this.currentIndex + 1) % this.activeList.length;
                    
                    if (this.currentMode === 'study' && this.autoPronounce) {
                        this.speakWord(this.activeList[this.currentIndex].word);
                    }
                },
                
                prevCard() {
                    if (this.activeList.length === 0) return;
                    this.showDetails = false;
                    this.currentIndex = (this.currentIndex - 1 + this.activeList.length) % this.activeList.length;
                    
                    if (this.currentMode === 'study' && this.autoPronounce) {
                        this.speakWord(this.activeList[this.currentIndex].word);
                    }
                },
                
                markStatus(status) {
                    this.activeList[this.currentIndex].status = status;
                    this.saveProgress();
                    if(status === '已記住') setTimeout(() => this.nextCard(), 300);
                },
                
                startStudyMode() {
                    this.currentMode = 'study';
                    if (this.autoPronounce) {
                        this.speakWord(this.currentObj.word);
                    }
                },
                
                startGridMode() {
                    this.currentMode = 'grid';
                    this.initGrid();
                },
                
                initGrid() {
                    let arr = [...this.activeList];
                    for (let i = arr.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [arr[i], arr[j]] = [arr[j], arr[i]];
                    }
                    this.gridItems = arr.slice(0, 9);
                },
                
                downloadProgress() {
                    this.saveProgress();
                    const dataStr = localStorage.getItem('flashcard_progress_v3');
                    const blob = new Blob([dataStr], {type: "application/json"});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'progress.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                },
                
                speakWord(wordText) {
                    if (!wordText || wordText === "無資料") return;
                    
                    const synth = window.speechSynthesis;
                    synth.cancel(); // 停止上一句發音，避免重疊
                    
                    const utterance = new SpeechSynthesisUtterance(wordText);
                    
                    if (this.pronounceLang === 'zh-HK') {
                        utterance.lang = 'zh-HK';
                    } else if (this.pronounceLang === 'zh-CN') {
                        utterance.lang = 'zh-CN';
                    } else if (this.pronounceLang === 'en-US') {
                        utterance.lang = 'en-US';
                    } else {
                        // 自動偵測模式 (已處理 Python 3.12 警告 \s)
                        const isEnglish = this.currentDeckName.includes('英文') || /^[a-zA-Z\s]+$/.test(wordText);
                        utterance.lang = isEnglish ? 'en-US' : 'zh-HK';
                    }
                    
                    synth.speak(utterance);
                }
            }
        }
    </script>
</body>
</html>
